[target.powerpc-unknown-linux-muslspe]
linker = "rust-lld"
rustflags = [
    "-Z", "unstable-options",
    "-C", "linker-flavor=gnu-lld",
    "-C", "panic=abort",
    "-C", "target-feature=+crt-static",
]

[target.powerpc-unknown-linux-gnuspe]
linker = "rust-lld"
rustflags = [
    "-Z", "unstable-options",
    "-C", "linker-flavor=gnu-lld",
    "-C", "panic=abort",
    "-C", "link-arg=target/sysroot/lib/Scrt1.o",
    "-C", "link-arg=target/sysroot/lib/crti.o",
    "-C", "link-arg=-Ltarget/sysroot/lib",
    "-C", "link-arg=-dynamic-linker",
    "-C", "link-arg=/lib/ld.so.1",
    "-C", "link-arg=target/sysroot/lib/crtn.o",
]

[build]
target = "powerpc-unknown-linux-muslspe"
